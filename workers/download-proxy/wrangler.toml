# Deployed by .github/workflows/proxy.yml ("Store: deploy download proxy").
# Secret DOWNLOAD_PROXY_KEY (same value as the download function's) is set by that workflow.
name = "accretion-download-proxy"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "dl.getaccretion.app", custom_domain = true }]

[vars]
# /download passes requests on to this (the store's download function)
DOWNLOAD_FUNCTION = "https://bbcjpinhvlxocjxlyplt.supabase.co/functions/v1/download"

# /get/<mod> (public post links for our own mods): at most 10 a minute per visitor
[[ratelimits]]
name = "POST_LINKS"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability]
enabled = false
