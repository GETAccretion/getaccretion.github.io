name: "Store: install reports digest"

# Mondays (or on demand): a digest of last week's install reports, grouped by likely cause by an
# OpenRouter model. Posted as the run summary and as one GitHub issue per week (only when there are
# reports). Needs the OPENROUTER_API_KEY secret; without it the digest has the raw counts only.
on:
  schedule:
    - cron: "11 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Write the digest
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/install_reports_digest.py > digest.md
          cat digest.md >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q "No reports this week" digest.md; then
            gh issue create --title "Install reports: week of $(date -u +%Y-%m-%d)" --body-file digest.md
          fi

  alert:
    # Scheduled runs only: opens one issue when the run fails, closes it when a later run passes.
    needs: [digest]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # an alert that cannot be sent must not turn a good run red
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out the alert action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - name: Open or close the failure issue
        uses: ./.github/actions/alert
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          workflow: "Store: install reports digest"
