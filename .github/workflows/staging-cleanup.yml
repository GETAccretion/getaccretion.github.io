name: "Store: clean staging uploads"

# Daily maintenance removes only old staging uploads; manual runs default to inspection.
# Publishing this schedule requires approval of its bounded recurring deletion scope.
on:
  schedule:
    - cron: "53 12 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Remove at most 100 private staging objects older than 48 hours"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -q "boto3==1.43.111"
      - name: Inspect or remove old staging uploads
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python scripts/staging_cleanup.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  alert:
    # Scheduled runs only: opens one issue when the run fails, closes it when a later run passes.
    needs: [cleanup]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # an alert that cannot be sent must not turn a good run red
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out the alert action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - name: Open or close the failure issue
        uses: ./.github/actions/alert
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          workflow: "Store: clean staging uploads"
