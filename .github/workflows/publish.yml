name: "Store: publish (shared steps)"

# Shared pipeline behind build.yml, discover.yml and links.yml.
# Steps run in order: validate code -> discover -> check links -> merge (cards) -> icons -> PNG cards
# -> site -> Pages artifact + Firebase mirror -> commit (checked_push); the pages job then deploys.
on:
  workflow_call:
    inputs:
      discover:
        type: boolean
        default: false
      check_links:
        type: boolean
        default: false
    secrets:
      GH_SEARCH_TOKEN:
        required: false
      FIREBASE_SERVICE_ACCOUNT:
        required: false
      SUPABASE_ACCESS_TOKEN:
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false

permissions:
  actions: write
  statuses: write
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # main as it is now, not the commit that triggered the run, so runs never undo each other
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Scheduled rebuilds publish directly, so validate the checked-out code before using it.
      - name: Validate publishing code
        run: |
          pip install -q ruff==0.16.8 pillow==11.3.0 boto3==1.43.111 cryptography==46.0.3
          ruff check .
          ruff format --check .
          python -m unittest discover -s tests -q
          node --test tests/edge/*.test.cjs
          node --check site/app.js
          node --check site/social.js
          node --check site/sw.js

      # last good copy of every source, so a source that is down keeps its apps
      - name: Restore the source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: sources-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sources-

      - name: Discover sources
        if: inputs.discover
        run: python scripts/discover.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_SEARCH_TOKEN: ${{ secrets.GH_SEARCH_TOKEN }}

      - name: Check download links
        if: inputs.check_links
        run: python scripts/check_links.py

      - name: Merge and validate
        run: python scripts/merge.py

      # host every app icon on the store's own https address (blank/insecure icons in installers)
      - name: Host app icons
        run: |
          pip install -q "pillow==11.3.0"
          python scripts/icons.py

      # PNG copies of the stat cards for forums and chats that do not show SVG
      - name: Render PNG cards
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          python scripts/render_png.py

      # the store's public address, for the sitemap; works for any repo or custom domain
      - name: Find the store address
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true

      - name: Build web store
        run: python scripts/site.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Settings > Secrets and variables > Actions > Variables (public values)
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          DOWNLOAD_PROXY_ORIGIN: ${{ vars.DOWNLOAD_PROXY_ORIGIN }}
          # on: publish download-server links instead of source URLs (handbook issue #25, phase 2)
          PRIVATE_LINKS: ${{ vars.PRIVATE_LINKS }}
          # EZOIC_ADSTXT_ID set: ads.txt from Ezoic's Ads.txt Manager (+ our lines), needed before Google MCM.
          # EZOIC on: Ezoic serves the ads on every page instead of the AdSense tags.
          EZOIC: ${{ vars.EZOIC }}
          EZOIC_ADSTXT_ID: ${{ vars.EZOIC_ADSTXT_ID }}

      # Every version's file link into the private table the download function reads (never fails the build)
      - name: Save private download links
        run: python scripts/sync_links.py
        timeout-minutes: 5
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Package the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      # A free mirror of the same web store on Firebase Hosting (accretion-72875.web.app), for when
      # GitHub Pages is down. Never fails the build; skipped while the deploy secret is missing.
      - name: Mirror to Firebase Hosting
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "No FIREBASE_SERVICE_ACCOUNT secret; skipped."; exit 0; fi
          creds="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$creds"
          GOOGLE_APPLICATION_CREDENTIALS="$creds" npx --yes firebase-tools@15.33.0 deploy \
            --only hosting --project accretion-72875 --non-interactive --message "Store build ${GITHUB_SHA::7}"
          rm -f "$creds"

      # Own releases and a daily digest of new safe apps to the Telegram channel (scripts/telegram.py), each
      # with an animated card (scripts/telegram_card.py: Pillow frames, imageio-ffmpeg's bundled ffmpeg).
      # Never fails the build; prints instead of posting until TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT are set,
      # and posts without the card when it can't be made.
      - name: Post to Telegram
        continue-on-error: true
        timeout-minutes: 8
        run: |
          pip install -q "imageio-ffmpeg==0.6.0" || echo "imageio-ffmpeg not installed: posts go without the card"
          python scripts/telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}

      - name: Summary
        run: cat REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="source.json curated.json stats.json history.json REPORT.md discovered.txt discovered.json dead_links.json link_dates.json first_seen.json telegram.json assets/card-dark.svg assets/card-light.svg assets/recent-dark.svg assets/recent-light.svg assets/card-dark.png assets/recent-dark.png"
          existing=$(for f in $files; do if [ -e "$f" ]; then echo "$f"; fi; done)
          # skip commits that would only change the build time
          if [ -z "$(git status --porcelain -- source.json curated.json discovered.txt dead_links.json link_dates.json first_seen.json telegram.json)" ]; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $existing
          git commit -m "${{ inputs.discover && 'Discover sources and rebuild' || inputs.check_links && 'Check links and rebuild' || 'Rebuild source' }}"
          python scripts/checked_push.py store

  # The web store. Needs Settings > Pages > Source: GitHub Actions (one time).
  # Until then this job fails on its own without failing the source build.
  pages:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
