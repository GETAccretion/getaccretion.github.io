name: "Store: health check"

# Daily (or on demand): the three download sources answer for the newest Accretion build
# (CloudFront, the Supabase copy, the Oracle copy), Supabase free-plan room, and the AWS free plan's
# end date. Anything that needs action opens one "Health check" issue (or comments on the open one).
on:
  schedule:
    - cron: "37 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -q "boto3==1.43.111" "cryptography==46.0.3"
      - name: Run the health checks
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CDN_DOMAIN: ${{ vars.CDN_DOMAIN }}
          CDN_KEY_PAIR_ID: ${{ vars.CDN_KEY_PAIR_ID }}
          CDN_PRIVATE_KEY: ${{ secrets.CDN_PRIVATE_KEY }}
          OCI_BUILDS_HOST: ${{ vars.OCI_BUILDS_HOST }}
          OCI_LINK_SECRET: ${{ secrets.OCI_LINK_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_SECRET: ${{ secrets.OSS_SECRET }}
          OSS_HOST: ${{ vars.OSS_HOST }}
          ADMOB_CLIENT_ID: ${{ secrets.ADMOB_CLIENT_ID }}
          ADMOB_CLIENT_SECRET: ${{ secrets.ADMOB_CLIENT_SECRET }}
          ADMOB_REFRESH_TOKEN: ${{ secrets.ADMOB_REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/health_check.py > health.md
          cat health.md | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -qE '^(FAIL|WARN)' health.md; then
            open=$(gh issue list --state open --search 'in:title "Health check"' --json number -q '.[0].number')
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file health.md
            else
              gh issue create --title "Health check: action needed" --body-file health.md
            fi
            if grep -q '^FAIL' health.md; then exit 1; fi
          fi
