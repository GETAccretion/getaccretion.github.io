name: "Store: AI jobs"

# Jobs that use free language models (scripts/ai_jobs.py, models in ai/models.json):
#   listings  4 times a day   clean store text for apps -> ai/listings.json (merge.py applies it)
#   moderate  every 30 min    flag unsafe community posts for the moderators (never hides a post)
#   sources   daily           sort newly found source URLs -> ai/sources.json, for the owner to review
#   similar   daily           free Gemini embeddings -> ai/similar.json (Similar apps shelf), ai/duplicates.json
#   images    daily           Gemini checks app icons -> ai/images.json (nsfw icons get the placeholder)
#   models    Mondays         test the free models and keep the best four; opens an issue on a change
# Results are committed under ai/. Needs GEMINI_API_KEY and/or OPENROUTER_API_KEY, and for moderate
# SUPABASE_ACCESS_TOKEN.
on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "7,37 * * * *"
    - cron: "43 5 * * *"
    - cron: "23 6 * * 1"
    - cron: "51 4 * * *"
    - cron: "29 3 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        options: [listings, moderate, sources, similar, images, models]
        default: listings
      limit:
        description: Most items to handle, like 20 (empty for the job's own default)
        type: string
        default: ""

permissions:
  actions: write
  statuses: write
  contents: write
  issues: write

concurrency:
  # one queue per job, so a long listings run never drops the half-hourly moderation runs
  group: ai-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Pick the job
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            job="$INPUT_JOB"
          else
            case "$SCHEDULE" in
              "17 */3 * * *") job=listings ;;
              "7,37 * * * *") job=moderate ;;
              "43 5 * * *") job=sources ;;
              "51 4 * * *") job=similar ;;
              "29 3 * * *") job=images ;;
              *) job=models ;;
            esac
          fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
      - name: Install moderation dependencies
        if: steps.pick.outputs.job == 'moderate'
        run: pip install -q "boto3==1.43.111"
      - name: Run the AI job
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          JOB: ${{ steps.pick.outputs.job }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$LIMIT" ] && [ "$JOB" != "models" ]; then args=(--limit "$LIMIT"); fi
          python scripts/ai_jobs.py "$JOB" "${args[@]}" | tee ai-output.txt
          cat ai-output.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "AI: $JOB results"
          python scripts/checked_push.py store
      - name: Open an issue when the model order changed
        if: steps.pick.outputs.job == 'models'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if grep -q '^CHANGED' ai-output.txt; then
            gh issue create --title "AI models: new order $(date -u +%Y-%m-%d)" --body-file ai-output.txt
          fi

  alert:
    # Scheduled runs only: opens one issue when the run fails, closes it when a later run passes.
    needs: [run]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # an alert that cannot be sent must not turn a good run red
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out the alert action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - name: Open or close the failure issue
        uses: ./.github/actions/alert
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          workflow: "Store: AI jobs"
