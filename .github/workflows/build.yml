name: "Store: build and publish"

# Scheduled runs check every download link. Code/site pushes rebuild immediately;
# manual runs can opt into the slower link scan.
on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths: [sources.txt, blocklist.txt, dead_hosts.txt, popular.txt, support.json, "scripts/**", "site/**"]
  workflow_dispatch:
    inputs:
      check_links:
        description: "Check download links before rebuilding (slower)"
        type: boolean
        default: false

permissions:
  actions: write
  statuses: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      check_links: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.check_links) }}
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  alert:
    # Scheduled runs only: opens one issue when the run fails, closes it when a later run passes.
    needs: [publish]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # an alert that cannot be sent must not turn a good run red
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out the alert action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - name: Open or close the failure issue
        uses: ./.github/actions/alert
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          workflow: "Store: build and publish"
