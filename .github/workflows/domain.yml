name: "Store: DNS records"

# Keeps getaccretion.app's Cloudflare DNS equal to dns.json (scripts/dns.py). A push that changes
# dns.json applies it; the weekly run and manual runs without apply only check and fail on drift.
on:
  push:
    branches: [main]
    paths: [dns.json, scripts/dns.py]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: Create and remove records to match dns.json (off means check only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency: domain

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compare or update the DNS records
        id: dns
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/dns.py ${{ (github.event_name == 'push' || inputs.apply) && '--apply' || '' }}
      - name: Summary
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          APPLY: ${{ (github.event_name == 'push' || inputs.apply) && 'yes' || 'no' }}
        run: |
          failed=$(jq -r 'to_entries | map(select(.value.conclusion == "failure") | .key | gsub("-"; " ")) | join(", ")' <<< "$STEPS")
          {
            if [ "$JOB_STATUS" = success ]; then
              echo "### DNS records match dns.json"
            else
              echo "### The DNS records do not match dns.json"
              echo "Failed step: ${failed:-unknown}. If the failed step is the DNS one, the records at Cloudflare differ from dns.json: run this workflow again with Apply ticked, or fix dns.json."
            fi
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| " + (.key | gsub("-"; " ")) + " | " + (.value.conclusion // "not run") + " |"' <<< "$STEPS"
            echo
            echo "| Fact | Value |"
            echo "| --- | --- |"
            echo "| Mode | $([ "$APPLY" = yes ] && echo "records updated" || echo "check only") |"
          } >> "$GITHUB_STEP_SUMMARY"

  alert:
    # Scheduled runs only: opens one issue when the run fails, closes it when a later run passes.
    needs: [dns]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # an alert that cannot be sent must not turn a good run red
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out the alert action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - name: Open or close the failure issue
        uses: ./.github/actions/alert
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          workflow: "Store: DNS records"
