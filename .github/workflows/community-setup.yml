name: "Store: set up backend"

# One click: creates (or reuses) the Supabase project, applies supabase/schema.sql, points
# sign-in links at the store, saves the public URL + key to supabase/project.json, then
# rebuilds the store. Run it again with your username after signing up to become admin.
# Needs the SUPABASE_ACCESS_TOKEN repository secret (supabase.com/dashboard/account/tokens).
on:
  # monthly: re-signs the Apple sign-in key (Apple allows 6 months at most) and re-checks setup
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:
    inputs:
      admin_username:
        description: "Store username to make an admin (sign up on the store first; leave empty on the first run)"
        required: false
        default: ""
      region:
        description: "Where to host the database (pick the one closest to most users)"
        type: choice
        default: us-east-1
        options: [us-east-1, us-east-2, us-west-1, sa-east-1, eu-west-1, eu-west-2, eu-central-1, ap-southeast-1, ap-northeast-1, ap-south-1]
      prune_supabase:
        description: "Prune: remove Supabase fallback copies older than each app's newest 5 (they stay in S3)"
        type: boolean
        default: false

permissions:
  actions: write
  statuses: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  setup:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_APPLE_KEY: ${{ secrets.APPLE_PRIVATE_KEY != '' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Find the store address
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true
      - name: Install Apple key signing
        id: apple-key
        if: env.HAS_APPLE_KEY == 'true'
        run: pip install "pyjwt[crypto]==2.9.0"
      - name: Create and configure the Supabase project
        id: supabase-project
        run: python scripts/supabase_setup.py
        env:
          # sign-in providers: each one switches on when its secrets are set (see supabase/README.md)
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          # or one secret per provider holding both the client ID and the secret
          GOOGLE_KEYS: ${{ secrets.GOOGLE }}
          GIT_KEYS: ${{ secrets.GIT }}
          DISCORD_KEYS: ${{ secrets.DISCORD }}
          # mail account for sign-up and password emails (see supabase/README.md)
          SMTP: ${{ secrets.SMTP }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          APPLE_SERVICES_ID: ${{ secrets.APPLE_SERVICES_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SITE_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || '' }}
          SUPABASE_REGION: ${{ inputs.region || 'us-east-1' }}
          ADMIN_USERNAME: ${{ inputs.admin_username }}
      # Accretion-hosted builds: download (login or personal key), personal sources, and upload
      # (release workflows put new builds in the private bucket with ACCRETION_UPLOAD_KEY).
      # --no-verify-jwt: AltStore and friends call with a key, not a login; the functions check it.
      # Builds on AWS (aws/builds-cdn.yaml): switches on when the BUILDS_* and CDN_* secrets and
      # variables are set. Every build is kept in both stores first: CloudFront serves from S3, and
      # the download function falls back to Supabase if AWS is unavailable.
      - name: Keep hosted builds in S3 and Supabase
        id: hosted-builds
        if: vars.BUILDS_BUCKET != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BUILDS_BUCKET: ${{ vars.BUILDS_BUCKET }}
          BUILDS_REGION: ${{ vars.BUILDS_REGION }}
          BUILDS_AWS_KEY_ID: ${{ secrets.BUILDS_AWS_KEY_ID }}
          BUILDS_AWS_SECRET: ${{ secrets.BUILDS_AWS_SECRET }}
          PRUNE_SUPABASE: ${{ inputs.prune_supabase }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_SECRET: ${{ secrets.OSS_SECRET }}
          OSS_HOST: ${{ vars.OSS_HOST }}
        run: |
          pip install "boto3==1.43.111"
          python scripts/copy_builds_to_s3.py
      - name: Deploy download functions
        id: download-functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          UPLOAD_KEY: ${{ secrets.ACCRETION_UPLOAD_KEY }}
          BUILDS_BUCKET: ${{ vars.BUILDS_BUCKET }}
          BUILDS_REGION: ${{ vars.BUILDS_REGION }}
          BUILDS_AWS_KEY_ID: ${{ secrets.BUILDS_AWS_KEY_ID }}
          BUILDS_AWS_SECRET: ${{ secrets.BUILDS_AWS_SECRET }}
          CDN_DOMAIN: ${{ vars.CDN_DOMAIN }}
          CDN_KEY_PAIR_ID: ${{ vars.CDN_KEY_PAIR_ID }}
          CDN_PRIVATE_KEY: ${{ secrets.CDN_PRIVATE_KEY }}
          OCI_BUILDS_HOST: ${{ vars.OCI_BUILDS_HOST }}
          OCI_LINK_SECRET: ${{ secrets.OCI_LINK_SECRET }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          OSS_REGION: ${{ vars.OSS_REGION }}
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_SECRET: ${{ secrets.OSS_SECRET }}
          OSS_HOST: ${{ vars.OSS_HOST }}
          DOWNLOAD_PROXY_KEY: ${{ secrets.DOWNLOAD_PROXY_KEY }}
          DOWNLOAD_PROXY_ORIGIN: ${{ vars.DOWNLOAD_PROXY_ORIGIN }}
        run: |
          ref=$(jq -r .url supabase/project.json | sed -E 's#https://([^.]+)\..*#\1#')
          if [ -n "$UPLOAD_KEY" ]; then
            npx --yes supabase@2.120.0 secrets set --project-ref "$ref" UPLOAD_KEY="$UPLOAD_KEY"
          fi
          if [ -n "$BUILDS_BUCKET" ] && [ -n "$CDN_PRIVATE_KEY" ]; then
            # the private key goes in as one line ("\n" escapes); the download function restores it
            key_one_line=$(printf '%s' "$CDN_PRIVATE_KEY" | awk 'BEGIN{ORS="\\n"} {print}')
            npx --yes supabase@2.120.0 secrets set --project-ref "$ref" \
              BUILDS_BUCKET="$BUILDS_BUCKET" BUILDS_REGION="$BUILDS_REGION" \
              BUILDS_AWS_KEY_ID="$BUILDS_AWS_KEY_ID" BUILDS_AWS_SECRET="$BUILDS_AWS_SECRET" \
              CDN_DOMAIN="$CDN_DOMAIN" CDN_KEY_PAIR_ID="$CDN_KEY_PAIR_ID" CDN_PRIVATE_KEY="$key_one_line"
          fi
          if [ -n "$OCI_BUILDS_HOST" ] && [ -n "$OCI_LINK_SECRET" ]; then
            # the third download copy (Oracle Cloud server, handbook infra/)
            npx --yes supabase@2.120.0 secrets set --project-ref "$ref"               OCI_BUILDS_HOST="$OCI_BUILDS_HOST" OCI_LINK_SECRET="$OCI_LINK_SECRET"
          fi
          if [ -n "$OSS_BUCKET" ] && [ -n "$OSS_REGION" ] && [ -n "$OSS_KEY_ID" ] && [ -n "$OSS_SECRET" ]; then
            # the fourth download copy (Alibaba Cloud OSS, filled from S3 by copy_builds_to_s3.py)
            npx --yes supabase@2.120.0 secrets set --project-ref "$ref" OSS_BUCKET="$OSS_BUCKET" OSS_REGION="$OSS_REGION" OSS_KEY_ID="$OSS_KEY_ID" OSS_SECRET="$OSS_SECRET"
            if [ -n "$OSS_HOST" ]; then
              # our domain mapped to the bucket (OSS refuses .ipa files on its own endpoints)
              npx --yes supabase@2.120.0 secrets set --project-ref "$ref" OSS_HOST="$OSS_HOST"
            fi
          fi
          if [ -n "$DOWNLOAD_PROXY_KEY" ] && [ -n "$DOWNLOAD_PROXY_ORIGIN" ]; then
            # other sources' apps go through the download proxy (workers/download-proxy)
            npx --yes supabase@2.120.0 secrets set --project-ref "$ref" \
              DOWNLOAD_PROXY_KEY="$DOWNLOAD_PROXY_KEY" DOWNLOAD_PROXY_ORIGIN="$DOWNLOAD_PROXY_ORIGIN"
          fi
          npx --yes supabase@2.120.0 functions deploy download source upload manifest saves studio shots \
            --project-ref "$ref" --no-verify-jwt --use-api
      - name: Save public settings
        id: save-settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- supabase/project.json)" ]; then echo "No changes."; echo "saved=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/project.json
          git commit -m "Community: save Supabase project settings"
          python scripts/checked_push.py store
          echo "saved=yes" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          REGION: ${{ inputs.region || 'us-east-1' }}
          PRUNE: ${{ inputs.prune_supabase }}
          SAVED: ${{ steps.save-settings.outputs.saved }}
          HOSTED_BUILDS: ${{ vars.BUILDS_BUCKET != '' }}
        run: |
          failed=$(jq -r 'to_entries | map(select(.value.conclusion == "failure") | .key | gsub("-"; " ")) | join(", ")' <<< "$STEPS")
          {
            if [ "$JOB_STATUS" = success ]; then
              echo "### The community backend is set up"
            else
              echo "### Community setup did not finish"
              echo "Failed step: ${failed:-unknown}. Open that step above to read the log. A missing token or secret is the usual cause: check the secrets named in supabase/README.md, then run this workflow again."
            fi
            echo
            echo "| Step | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| " + (.key | gsub("-"; " ")) + " | " + (.value.conclusion // "not run") + " |"' <<< "$STEPS"
            echo
            echo "| Fact | Value |"
            echo "| --- | --- |"
            echo "| Database region | $REGION |"
            echo "| Supabase project | $(jq -r .url supabase/project.json 2> /dev/null || echo unknown) |"
            echo "| Builds kept in S3 and Supabase | $([ "$HOSTED_BUILDS" = true ] && echo yes || echo no) |"
            echo "| Old Supabase copies pruned | $([ "$PRUNE" = true ] && echo yes || echo no) |"
            echo "| Project settings saved to the repo | $([ "$SAVED" = yes ] && echo yes || echo no) |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: setup
    uses: ./.github/workflows/publish.yml
    secrets:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # fills the private download links table; without it, other sources' downloads find nothing
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  alert:
    # Scheduled runs only: opens one issue when the run fails, closes it when a later run passes.
    needs: [verify, setup, publish]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # an alert that cannot be sent must not turn a good run red
    continue-on-error: true
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check out the alert action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
      - name: Open or close the failure issue
        uses: ./.github/actions/alert
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}
          workflow: "Store: set up backend"
